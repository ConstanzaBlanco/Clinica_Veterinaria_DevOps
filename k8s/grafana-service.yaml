apiVersion: v1

# Crea una dirección estable para acceder a Grafana
kind: Service

metadata:
  name: grafana
  namespace: clinica-veterinaria

spec:
  # Permite abrir la UI de Grafana desde fuera del clúster, igual que "api",
  # "frontend" y "prometheus"
  type: NodePort

  selector:
    app: grafana

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
