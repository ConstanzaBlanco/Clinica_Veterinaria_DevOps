apiVersion: v1

# Guarda el archivo de configuración de Prometheus como datos planos
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: clinica-veterinaria

data:
  # Prometheus busca este archivo en /etc/prometheus/prometheus.yml por defecto
  prometheus.yml: |
    global:
      # Cada cuánto scrapea los targets
      scrape_interval: 15s

    scrape_configs:
      - job_name: "pet-core-api"
        metrics_path: /metrics

        # Apunta al Service "api-monitoring", el Deployment dedicado a este
        # entregable — a propósito NO es el Service "api" de Blue/Green: ese es
        # requisito del entregable 1, y el monitoreo queda desacoplado de esa
        # complejidad (no depende de qué versión esté activa, ni de tener
        # Blue/Green desplegado para funcionar).
        static_configs:
          - targets: ["api-monitoring:8000"]

      - job_name: "kubernetes-cadvisor"
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # Conservar solo el cgroup del pod, evitando sumar tambien sus contenedores.
          - source_labels: [namespace, pod, container, id]
            regex: clinica-veterinaria;api-monitoring-.+;;.*/[^/]*pod[^/]+
            action: keep
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_spec_cpu_quota|container_spec_cpu_period|container_memory_working_set_bytes|container_spec_memory_limit_bytes
            action: keep
