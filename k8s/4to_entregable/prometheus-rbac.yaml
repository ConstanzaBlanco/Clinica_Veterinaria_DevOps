apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: petcore
---
# Los nombres del ClusterRole y del ClusterRoleBinding son DISTINTOS a los de
# k8s/prometheus-rbac.yaml (pet-core-prometheus) a proposito: son recursos de
# todo el cluster, y con el mismo nombre este apply pisaria el binding del
# monitoreo viejo (D2/D3) apuntandolo al namespace petcore.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: petcore-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Acceso al endpoint de cAdvisor a traves del API server.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: petcore-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: petcore-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: petcore
