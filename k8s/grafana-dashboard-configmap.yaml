apiVersion: v1

# Deja el dashboard de Pet-Core ya cargado en Grafana al arrancar, como código
# versionado — nadie tiene que armar paneles a mano en la UI, y todo el equipo
# ve exactamente el mismo dashboard.
kind: ConfigMap

metadata:
  name: grafana-dashboards
  namespace: clinica-veterinaria

data:
  # Le dice a Grafana "cargá los .json que encuentres en esta carpeta como
  # dashboards". Va en el mismo directorio que el JSON de abajo.
  provider.yaml: |
    apiVersion: 1

    providers:
      - name: pet-core
        folder: Pet-Core
        type: file
        options:
          path: /var/lib/grafana/dashboards

  pet-core-monitoring.json: |
    {
      "title": "Pet-Core — Monitoreo",
      "uid": "pet-core-monitoring",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Turnos creados (ventana 5 min)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "increase(turnos_creados_total[5m])",
              "legendFormat": "turnos creados"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 10 }
                ]
              },
              "custom": {
                "thresholdsStyle": { "mode": "line" },
                "axisSoftMin": 0,
                "axisSoftMax": 15
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Logins fallidos (ventana 1 min)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "increase(logins_fallidos_total[1m])",
              "legendFormat": "logins fallidos"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 3 }
                ]
              },
              "custom": {
                "thresholdsStyle": { "mode": "line" },
                "axisSoftMin": 0,
                "axisSoftMax": 5
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Tasa de requests por endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (handler) (rate(http_requests_total[5m]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Latencia p95 por endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{handler}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" },
            "overrides": []
          }
        },

        {
          "id": 5,
          "title": "Errores 5xx (tasa)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{status=\"5xx\"}[5m]))",
              "legendFormat": "errores 5xx"
            }
          ]
        },
        {
          "id": 6,
          "title": "Turnos cancelados (últimas 24 h)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(increase(turnos_cancelados_total[24h])) or vector(0)",
              "legendFormat": "turnos cancelados",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "CPU de la API (% del límite)",
          "description": "Promedio de uso de CPU en 2 minutos respecto del límite del pod (1 núcleo). Un indicador por pod; rojo desde 75%.",
          "type": "gauge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{job=\"kubernetes-cadvisor\",namespace=\"clinica-veterinaria\",pod=~\"api-monitoring-.+\",container=\"\",id=~\".*/[^/]*pod[^/]+\"}[2m])) / sum by (namespace, pod) (container_spec_cpu_quota{job=\"kubernetes-cadvisor\",namespace=\"clinica-veterinaria\",pod=~\"api-monitoring-.+\",container=\"\",id=~\".*/[^/]*pod[^/]+\"} / container_spec_cpu_period{job=\"kubernetes-cadvisor\",namespace=\"clinica-veterinaria\",pod=~\"api-monitoring-.+\",container=\"\",id=~\".*/[^/]*pod[^/]+\"})",
              "legendFormat": "{{pod}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 75
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "RAM de la API (% del límite)",
          "description": "Memoria working set respecto del límite del pod (512 MiB). Un indicador por pod; rojo desde 75%.",
          "type": "gauge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (namespace, pod) (container_memory_working_set_bytes{job=\"kubernetes-cadvisor\",namespace=\"clinica-veterinaria\",pod=~\"api-monitoring-.+\",container=\"\",id=~\".*/[^/]*pod[^/]+\"}) / sum by (namespace, pod) (container_spec_memory_limit_bytes{job=\"kubernetes-cadvisor\",namespace=\"clinica-veterinaria\",pod=~\"api-monitoring-.+\",container=\"\",id=~\".*/[^/]*pod[^/]+\"})",
              "legendFormat": "{{pod}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 75
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "Turnos: p95 de consulta PostgreSQL vs endpoint",
          "description": "Comparación temporal en ventanas de 5 minutos. Query incluye ejecución y lectura desde SQLAlchemy, también fallos. HTTP mide todos los GET /turnos e incluye autenticación y serialización. Son percentiles de poblaciones distintas: no deben restarse ni prueban causalidad. Sin solicitudes no hay percentil.",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(pg_query_duration_seconds_bucket{job=\"pet-core-api\",query=\"listar_turnos_cliente\"}[5m])))",
              "legendFormat": "PostgreSQL: listar turnos (p95)"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"pet-core-api\",handler=\"/turnos\",method=\"GET\"}[5m])))",
              "legendFormat": "HTTP: GET /turnos (p95)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "decimals": 2,
              "custom": { "drawStyle": "line", "lineWidth": 2, "showPoints": "always", "pointSize": 4 }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {
              "mode": "multi"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
        {
          "id": 10,
          "title": "Clientes nuevos registrados (últimas 24 h)",
          "description": "Estimación de altas de clientes en las últimas 24 horas (increase). El contador vuelve a cero si el pod de la API se reinicia. Solo estadística de negocio, sin alerta asociada.",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 41 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(increase(clientes_registrados_total[24h])) or vector(0)",
              "legendFormat": "clientes nuevos",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "blue", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        }        
      ]
    }
