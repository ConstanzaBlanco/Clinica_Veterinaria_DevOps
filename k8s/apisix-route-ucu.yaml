# Ruta publica de Pet-Core en el gateway APISIX del laboratorio.
# "reto-ucu.net" tiene un wildcard de DNS (*.reto-ucu.net resuelve al mismo
# gateway) - en vez de colgarnos del subdominio del proyecto anterior
# (equipo2-proyecto4) con un path largo, usamos nuestro propio subdominio
# "petcore.reto-ucu.net" y la app queda en la raiz. Esto ademas evita el
# problema de rutas absolutas (/assets/*, /api/*) que tenia la version con
# prefijo: al vivir en la raiz, coinciden sin reescribir nada.
#
# El Ingress nginx que crea la chart de Helm (host "petcore.local") no sirve
# para esto: resuelve a una IP interna del cluster, no alcanzable desde
# afuera.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: petcore-route
  namespace: alumno-team8
spec:
  http:
    - name: petcore-frontend
      match:
        hosts:
          - petcore.reto-ucu.net
        paths:
          - /*
      backends:
        - serviceName: frontend
          servicePort: 8080

    # El backend (FastAPI) no tiene prefijo "/api" en sus rutas (ver
    # app/main.py), asi que hay que sacarle el "/api/" antes de reenviar,
    # igual que hace nginx.conf del frontend en local/minikube.
    - name: petcore-api
      match:
        hosts:
          - petcore.reto-ucu.net
        paths:
          - /api/*
      backends:
        - serviceName: api
          servicePort: 8000
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/api/(.*)", "/$1"]
