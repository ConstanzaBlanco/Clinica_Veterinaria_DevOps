# Ruta publica de Pet-Core en el gateway APISIX del laboratorio.
# "reto-ucu.net" tiene un wildcard de DNS (*.reto-ucu.net resuelve al mismo
# gateway) - en vez de colgarnos del subdominio del proyecto anterior
# (equipo2-proyecto4) con un path largo, usamos nuestro propio subdominio
# "petcore.reto-ucu.net" y la app queda en la raiz.
#
# Una sola regla, todo al "frontend": el backend ("api") NO se expone
# directo en este gateway a proposito - el propio nginx del frontend
# (frontend/nginx.conf) ya tiene un proxy interno a "http://api:8000" para
# "/api/*", asi que no hace falta (ni conviene) que APISIX le pegue al
# backend de forma directa. Los clientes solo se comunican con el frontend;
# el backend queda alcanzable unicamente desde dentro del namespace.
#
# El Ingress nginx que crea la chart de Helm (host "petcore.local") no sirve
# para esto: resuelve a una IP interna del cluster, no alcanzable desde
# afuera.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: petcore-route
  namespace: alumno-team8
spec:
  http:
    - name: petcore-frontend
      match:
        hosts:
          - petcore.reto-ucu.net
        paths:
          - /*
      backends:
        - serviceName: frontend
          servicePort: 8080
