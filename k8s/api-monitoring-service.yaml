apiVersion: v1

# Crea una dirección estable para acceder a la API de monitoreo
kind: Service

metadata:
  name: api-monitoring
  namespace: clinica-veterinaria

spec:
  # Permite probarla desde fuera del clúster (Swagger, curl) igual que "api"
  type: NodePort

  # Selecciona únicamente el Pod de api-monitoring, nunca Blue/Green
  selector:
    app: clinica-api-monitoring

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
