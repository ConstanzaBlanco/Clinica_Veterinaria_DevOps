apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: clinica-veterinaria
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pet-core-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Acceso al endpoint de cAdvisor a traves del API server.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pet-core-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pet-core-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: clinica-veterinaria
