apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-alerting
  namespace: clinica-veterinaria

data:
  alerting.yaml: |
    apiVersion: 1

    groups:
      - orgId: 1
        name: pet-core-alertas
        folder: Pet-Core
        interval: 30s

        rules:
          - uid: pet-core-turnos-creados
            title: Exceso de turnos creados
            condition: B
            for: 0s
            noDataState: NoData
            execErrState: Error
            isPaused: false

            annotations:
              summary: Más de 10 turnos creados en los últimos 5 minutos.
              description: Revisar el volumen de reservas de la aplicación.

            labels:
              severity: warning
              categoria: negocio

            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  refId: A
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'sum(increase(turnos_creados_total{job="pet-core-api"}[5m]))'
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200

              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  refId: B
                  datasource:
                    type: __expr__
                    uid: __expr__
                  type: math
                  expression: "$A > 10"
                  intervalMs: 1000
                  maxDataPoints: 43200

          - uid: pet-core-logins-fallidos
            title: Exceso de intentos de login fallidos
            condition: B
            for: 0s
            noDataState: NoData
            execErrState: Error
            isPaused: false

            annotations:
              summary: Más de 3 intentos de login fallidos en el último minuto.
              description: Revisar posibles accesos sospechosos o errores de autenticación.

            labels:
              severity: warning
              categoria: seguridad

            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 60
                  to: 0
                model:
                  refId: A
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'sum(increase(logins_fallidos_total{job="pet-core-api"}[1m]))'
                  instant: true
                  range: false
                  intervalMs: 1000
                  maxDataPoints: 43200

              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  refId: B
                  datasource:
                    type: __expr__
                    uid: __expr__
                  type: math
                  expression: "$A > 3"
                  intervalMs: 1000
                  maxDataPoints: 43200
