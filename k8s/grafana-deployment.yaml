apiVersion: apps/v1

# Tipo de objeto que administra el Pod de Grafana
kind: Deployment

metadata:
  name: grafana
  namespace: clinica-veterinaria

spec:
  # Un solo Pod alcanza: igual que Prometheus, Grafana no tiene versión
  # Blue/Green propia
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      # Grafana no necesita hablarle a la API de Kubernetes
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Usuario/contraseña por defecto de la imagen (admin/admin, pide
          # cambiarla en el primer login). Alcanza para uso local en Minikube;
          # no se trata como secreto porque no hay datos reales en juego acá.

          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources

            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards

            - name: dashboards-json
              mountPath: /var/lib/grafana/dashboards
            
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true

          readinessProbe:
            httpGet:
              path: /api/health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources

        - name: dashboards-provider
          configMap:
            name: grafana-dashboards
            items:
              - key: provider.yaml
                path: provider.yaml

        - name: dashboards-json
          configMap:
            name: grafana-dashboards
            items:
              - key: pet-core-monitoring.json
                path: pet-core-monitoring.json
        
        - name: alerting
          configMap:
            name: grafana-alerting
