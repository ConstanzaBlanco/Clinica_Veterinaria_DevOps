apiVersion: v1
kind: Pod
metadata:
  name: pod-solo-root
  namespace: clinica-veterinaria
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi