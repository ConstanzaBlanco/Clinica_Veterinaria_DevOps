apiVersion: v1
kind: Pod
metadata:
  name: pod-solo-sin-probes
  namespace: clinica-veterinaria
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "128Mi" }