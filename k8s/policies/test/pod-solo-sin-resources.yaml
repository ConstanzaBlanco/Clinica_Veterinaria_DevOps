apiVersion: v1
kind: Pod
metadata:
  name: pod-solo-sin-resources
  namespace: clinica-veterinaria
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: app
      image: busybox:1.36
      livenessProbe:
        exec:
          command: ["true"]
      readinessProbe:
        exec:
          command: ["true"]
      command: ["sleep", "3600"]