# Dirección estable del frontend dentro del cluster. Es a donde manda el
# tráfico el Ingress (ver ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}
  labels:
    {{- include "petcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "petcore.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: http
