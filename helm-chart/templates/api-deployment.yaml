# API FastAPI. Basado en k8s/api-monitoring-deployment.yaml, pero con los
# valores fijos reemplazados por referencias a values.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  labels:
    {{- include "petcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "petcore.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "petcore.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Si cambia el ConfigMap, cambia este hash y Kubernetes reinicia los
        # Pods solos (sin esto, un "helm upgrade" que solo toca la config no
        # se aplicaría hasta el próximo reinicio).
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
    spec:
      # FastAPI no necesita hablar con la API de Kubernetes.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.api.securityContext.runAsUser }}
        runAsGroup: {{ .Values.api.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          # Si api.image.tag está vacío, "default" usa appVersion de Chart.yaml.
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}

          # Todas las claves del ConfigMap pasan a ser variables de entorno.
          envFrom:
            - configMapRef:
                name: {{ .Values.api.name }}-config

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: postgres-secret
              mountPath: /run/secrets
              readOnly: true
            - name: jwt-secret
              mountPath: /run/jwt-secret
              readOnly: true

          # ¿Puede recibir tráfico? Hasta que responda, el Service no le manda requests.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # ¿Sigue vivo? Si deja de responder, Kubernetes reinicia el contenedor.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: postgres-secret
          secret:
            secretName: {{ .Values.secrets.postgres }}
        - name: jwt-secret
          secret:
            secretName: {{ .Values.secrets.jwt }}
