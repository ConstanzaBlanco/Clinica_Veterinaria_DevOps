# API FastAPI. Basado en k8s/api-monitoring-deployment.yaml, pero con los
# valores fijos reemplazados por referencias a values.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  labels:
    {{- include "petcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "petcore.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "petcore.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Si cambia el ConfigMap, cambia este hash y Kubernetes reinicia los
        # Pods solos (sin esto, un "helm upgrade" que solo toca la config no
        # se aplicaría hasta el próximo reinicio).
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
    spec:
      # FastAPI no necesita hablar con la API de Kubernetes.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.api.securityContext.runAsUser }}
        runAsGroup: {{ .Values.api.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault

      {{- if .Values.api.esperarBaseDeDatos }}
      # Los initContainers corren ANTES que los containers, uno por uno, y
      # tienen que terminar bien para que arranque la API. Este se queda en
      # loop hasta que Postgres acepta conexiones en db:5432.
      # Usa la misma imagen de la API (ya trae Python): no hace falta bajar
      # otra imagen ni que pase por Kyverno una imagen nueva.
      initContainers:
        - name: esperar-base-de-datos
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import socket, time
              destino = ("{{ .Values.api.config.POSTGRES_SERVER }}", {{ .Values.api.config.POSTGRES_PORT }})
              while True:
                  try:
                      socket.create_connection(destino, timeout=2).close()
                      print("Postgres responde en %s:%s" % destino)
                      break
                  except OSError:
                      print("Esperando a Postgres en %s:%s..." % destino, flush=True)
                      time.sleep(2)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- end }}

      containers:
        - name: api
          # Si api.image.tag está vacío, "default" usa appVersion de Chart.yaml.
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}

          # Todas las claves del ConfigMap pasan a ser variables de entorno.
          envFrom:
            - configMapRef:
                name: {{ .Values.api.name }}-config

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: postgres-secret
              mountPath: /run/secrets
              readOnly: true
            - name: jwt-secret
              mountPath: /run/jwt-secret
              readOnly: true

          # ¿Puede recibir tráfico? Hasta que responda, el Service no le manda requests.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # ¿Sigue vivo? Si deja de responder, Kubernetes reinicia el contenedor.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: postgres-secret
          secret:
            secretName: {{ .Values.secrets.postgres }}
        - name: jwt-secret
          secret:
            secretName: {{ .Values.secrets.jwt }}
