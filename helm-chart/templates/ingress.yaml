{{- /*
Ingress: regla HTTP que dice "lo que llegue para el host petcore.local,
mandalo al Service frontend". El Ingress por sí solo no hace nada: lo
ejecuta un "Ingress controller" (en minikube, un nginx que se instala con
"minikube addons enable ingress"). Se puede apagar con ingress.enabled=false.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "petcore.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Todo (/, /api/..., los .js) va al frontend; su nginx reenvía
          # /api/... a la API.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  name: http
{{- end }}
