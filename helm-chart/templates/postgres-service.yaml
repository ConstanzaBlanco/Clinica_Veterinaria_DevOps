# Nombre estable "db" para llegar a Postgres desde la API (db:5432).
#
# Es "headless" (clusterIP: None): no tiene IP propia, el DNS del cluster
# (coredns) responde directamente con la IP del Pod postgres-0. Es lo que
# usa un StatefulSet para darle a cada Pod un nombre de red fijo.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    {{- include "petcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "petcore.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
