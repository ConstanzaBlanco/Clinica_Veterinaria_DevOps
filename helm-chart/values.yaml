# Valores por defecto de la chart de Pet-Core.
# Cada entorno pisa solo lo que cambia con -f values-dev.yaml / values-prod.yaml.
# Para ver el YAML final sin instalar nada: helm template petcore ./helm-chart

# --- Secrets ---
# La chart NO crea los Secrets: no queremos contraseñas dentro del repo ni del
# historial de Helm. Los crea el script de inicialización a partir de
# db/password.txt y db/jwt-secret.txt, y acá solo se indica cómo se llaman.
secrets:
  postgres: postgres-secret   # clave "db-password"
  jwt: jwt-secret             # clave "jwt-secret"

# --- PostgreSQL ---
postgres:
  # La API se conecta a "db:5432" (api.config.POSTGRES_SERVER), así que el
  # Service de Postgres tiene que llamarse igual.
  serviceName: db

  image:
    repository: postgres
    # Versión exacta (no "18" a secas, que va cambiando con cada release).
    tag: "18.6"
    pullPolicy: IfNotPresent

  # ConfigMap con los SQL de db/init/. Tampoco lo crea la chart: Helm no
  # puede leer archivos fuera de helm-chart/, y copiar los SQL adentro los
  # duplicaría. Lo crea el script de inicialización desde db/init/.
  initConfigMap: postgres-init

  # Disco persistente donde Postgres guarda los datos. Sobrevive aunque el
  # Pod se borre o se reinicie.
  storage: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # UID/GID del usuario "postgres" de la imagen oficial.
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

# --- API (FastAPI) ---
api:
  # Nombre del Deployment y del Service. El frontend (nginx.conf) llama a
  # http://api:8000, así que el Service tiene que llamarse "api".
  name: api

  replicaCount: 1

  image:
    repository: clinica-veterinaria
    # Vacío = usa appVersion de Chart.yaml (hoy "0.1.0"). Así hay un solo
    # lugar donde se define la versión, y scripts/4to_entregable/preparar-chart.sh construye
    # la imagen con ese mismo tag. Jenkins lo pisa con --set api.image.tag=...
    # Nunca "latest": lo prohíbe la política de Kyverno disallow-latest-tag.
    tag: ""
    # Never = usa la imagen construida dentro de minikube. Cuando Jenkins
    # publique en un registry, se cambia a IfNotPresent.
    pullPolicy: Never

  # Puerto donde escucha uvicorn dentro del contenedor (ver Dockerfile).
  containerPort: 8000

  service:
    # ClusterIP = solo accesible dentro del cluster; desde afuera se entra
    # por el Ingress. En dev se puede pasar a NodePort para usar Swagger.
    type: ClusterIP
    port: 8000

  # Requests y limits obligatorios (política require-resources).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Configuración no sensible de la app. Va al ConfigMap y llega al
  # contenedor como variables de entorno (ver app/config.py).
  config:
    POSTGRES_SERVER: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: petcore_app
    POSTGRES_DB: postgres
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
    LOGIN_MAX_INTENTOS: "5"
    LOGIN_BLOQUEO_MINUTOS: "15"

  # UID/GID sin privilegios creado en el Dockerfile del backend
  # (política disallow-root).
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
